plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.gamepad.client'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.gamepad.client'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2'
    }

    // Firma de la versión release: keystore/keystore.properties (NO se sube al repositorio).
    // Sin ese archivo se firma con la clave de depuración (se instala, pero no actualiza
    // una APK firmada con otra clave). Ver android/README.md.
    def ksProps = new Properties()
    def ksFile = rootProject.file('keystore/keystore.properties')
    if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        // Sin red hacia Maven Central: -Probolectric.dependency.dir=<carpeta con android-all-instrumented-*.jar>
        unitTests.all {
            def dir = project.findProperty('robolectric.dependency.dir')
            def shots = project.findProperty('gamepad.screenshots')
            if (shots) systemProperty 'gamepad.screenshots', shots
            if (dir) {
                systemProperty 'robolectric.offline', 'true'
                systemProperty 'robolectric.dependency.dir', dir
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Solo para los tests (Robolectric ejecuta la actividad en la JVM); no entra en la APK.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
}
